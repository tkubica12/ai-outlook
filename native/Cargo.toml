[package]
name = "tomlook"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Performance-first native Windows calendar and meeting workspace"

[[bin]]
name = "tomlook"
path = "src/main.rs"

[[bin]]
name = "tomlook-acceptance"
path = "src/main.rs"
test = false
bench = false

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.10.9"
url = "=2.5.8"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "auth", "reqwest-native-tls", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls"] }
github-copilot-sdk = { version = "=1.0.18-preview.0", default-features = false, features = ["runtime"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
async-trait = "=0.1.92"
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
tray-icon = { version = "=0.26.1", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
chrono-tz = "=0.10.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
